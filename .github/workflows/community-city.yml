name: Community map data

# Refreshes both community maps once a month, published to Vercel Blob; the
# pages read the files at runtime, so no deploy is needed.
# - community.lizheng.ai (docs/community-graph.md): members from the Circle
#   Admin API, likes and comments from the Circle Data API.
# - The homepage map (docs/community-city.md): reuses the same member list.
on:
  schedule:
    # 02:00 UTC on the 1st of every month (10:00 in Beijing).
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-city
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # About 255 Admin API requests (stops before starting if more than 300
      # are needed) and about 1,300 Data API requests (a separate allowance,
      # 600 a minute). Scheduled runs skip while the published graph is under
      # 20 days old.
      - name: Connection map (community.lizheng.ai)
        run: >-
          pnpm community:graph --upload --max-admin-requests=300
          ${{ github.event_name == 'schedule' && '--min-age-days=20' || '' }}
        env:
          CIRCLE_ADMIN_API: ${{ secrets.CIRCLE_ADMIN_API }}
          CIRCLE_DATA_API: ${{ secrets.CIRCLE_DATA_API }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # Reuses the member list above when it was just read; otherwise reads
      # Circle itself (about 250 requests).
      - name: Homepage map
        run: >-
          pnpm community:city --upload --max-requests=300
          --members-file=tmp/community-graph/members.json
          ${{ github.event_name == 'schedule' && '--min-age-days=20' || '' }}
        env:
          CIRCLE_ADMIN_API: ${{ secrets.CIRCLE_ADMIN_API }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
