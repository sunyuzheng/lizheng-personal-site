name: Community map data

# Refreshes the homepage community map (docs/community-city.md): one Circle
# Admin API snapshot a month, published to Vercel Blob. The site reads the file
# at runtime, so no deploy is needed.
on:
  schedule:
    # 02:00 UTC on the 1st of every month (10:00 in Beijing).
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-city
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # About 250 requests; stops before starting if more than 300 are needed.
      # Scheduled runs skip while the published snapshot is under 20 days old.
      - run: >-
          pnpm community:city --upload --max-requests=300
          ${{ github.event_name == 'schedule' && '--min-age-days=20' || '' }}
        env:
          CIRCLE_ADMIN_API: ${{ secrets.CIRCLE_ADMIN_API }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
