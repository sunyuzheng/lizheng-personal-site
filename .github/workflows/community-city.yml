name: Community map data

# Refreshes the community data every day (docs/community-graph.md): members
# from the Circle Admin API, likes and comments from the Circle Data API,
# written as graph.json (city.lizheng.ai and the homepage window) and
# city.json (the homepage's fallback dot map) on Vercel Blob. The pages read
# the files at runtime, so no deploy is needed.
on:
  schedule:
    # 02:00 UTC every day (10:00 in Beijing).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-city
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The member list (names, profile ids and pictures; no e-mail
      # addresses) carries over between days, so most days only the newest
      # members are read; the whole list is read again about once a week.
      - uses: actions/cache@v4
        with:
          path: |
            tmp/community-graph/members.json
            tmp/community-graph/avatars
          key: community-members-${{ github.run_id }}
          restore-keys: community-members-

      # Admin API: usually 1 request, about 255 once a week (stops before
      # starting if more than 300 are needed). Data API: about 850 requests,
      # a separate allowance of 600 a minute.
      - name: Build and publish
        run: pnpm community:graph --upload --max-admin-requests=300
        env:
          CIRCLE_ADMIN_API: ${{ secrets.CIRCLE_ADMIN_API }}
          CIRCLE_DATA_API: ${{ secrets.CIRCLE_DATA_API }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
